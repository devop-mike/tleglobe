<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TLE Globe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; }
    svg { display: block; cursor: grab; touch-action: none; }
    svg:active { cursor: grabbing; }
    .graticule { fill: none; stroke: #1a2a4a; stroke-width: 0.5; }
    .land { fill: #1a3a2a; stroke: #2a5a3a; stroke-width: 0.5; }
    .sphere { fill: #0d1b2a; }
    .border { fill: none; stroke: #0a2a1a; stroke-width: 0.3; }
    .sat { fill: #00ff88; fill-opacity: 0.85; }
    .trail { fill: none; stroke-width: 0.5; stroke-opacity: 0.25; }
    .sat-label { fill: #00ff88; font-family: monospace; font-size: 9px; pointer-events: none; opacity: 0.8; }

    /* ── Sidebar (desktop) / Drawer (mobile) ── */
    #sidebar {
      position: fixed;
      left: 0; top: 0;
      height: 100vh;
      width: 200px;
      background: rgba(10, 10, 26, 0.88);
      backdrop-filter: blur(4px);
      border-right: 1px solid #1a2a4a;
      display: flex;
      flex-direction: column;
      font-family: monospace;
      font-size: 0.8rem;
      color: #00ff88;
      user-select: none;
      z-index: 10;
    }

    #drawer-handle {
      display: none;
      justify-content: center;
      padding: 0.5rem 0;
      flex-shrink: 0;
    }

    #sidebar-controls {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a2a4a;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    #sidebar-controls label { cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    #sidebar-controls input[type="checkbox"] { accent-color: #00ff88; cursor: pointer; }
    #trail-length-row { display: none; align-items: center; gap: 0.4rem; }
    #trail-length-row.visible { display: flex; }
    #trail-length { accent-color: #00ff88; width: 80px; cursor: pointer; }
    #trail-length-value { min-width: 4ch; }
    #center-btn {
      background: none;
      border: 1px solid #00ff88;
      color: #00ff88;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.2rem;
    }
    #center-btn:hover { background: rgba(0,255,136,0.1); }

    #sat-list-header {
      padding: 0.4rem 1rem;
      font-size: 0.7rem;
      color: #3a5a4a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #1a2a4a;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #show-selected-row { display: none; align-items: center; gap: 0.3rem; }
    #show-selected-row.visible { display: flex; }
    #show-selected-row input { accent-color: #00ff88; cursor: pointer; }
    #show-selected-row label { cursor: pointer; font-size: 0.7rem; }

    #category-filters {
      padding: 0.4rem 1rem;
      border-bottom: 1px solid #1a2a4a;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex-shrink: 0;
    }
    .cat-row { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.75rem; }
    .cat-row input { cursor: pointer; }
    .cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .cat-count { color: #3a5a4a; }

    #sat-list { overflow-y: auto; flex: 1; }
    .sat-item {
      padding: 0.2rem 0.75rem;
      border-left: 3px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sat-item:hover, .sat-item.hovered { background: rgba(0,255,136,0.08); }
    .sat-item.selected { background: rgba(0,255,136,0.15); color: #fff; }

    /* ── Tooltip (desktop hover) ── */
    #tooltip {
      position: fixed;
      background: rgba(10, 10, 26, 0.92);
      color: #00ff88;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border: 1px solid #00ff88;
      pointer-events: none;
      display: none;
      z-index: 20;
      white-space: nowrap;
    }

    /* ── Name badge (mobile tap) ── */
    #name-badge {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,26,0.92);
      color: #00ff88;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
      border: 1px solid #00ff88;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 30;
      display: none;
    }
    #name-badge.visible { opacity: 1; }

    /* ── Mobile control cluster ── */
    #mobile-controls {
      display: none;
      position: fixed;
      bottom: 14px; right: 14px;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      z-index: 20;
    }
    .ctrl-btn {
      width: 40px; height: 40px;
      background: rgba(10,10,26,0.88);
      border: 1px solid #1a4a3a;
      border-radius: 6px;
      color: #00ff88;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active { background: rgba(0,255,136,0.15); }
    #ctrl-grid {
      display: grid;
      grid-template-columns: repeat(8, 40px);
      grid-template-rows: auto 40px 40px;
      gap: 4px;
    }
    .dpad-label {
      font-family: monospace;
      font-size: 0.6rem;
      color: #3a5a4a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
    }
    #ctrl-grid .gap { width: 40px; }
    #mobile-controls { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    #mobile-controls.drawer-open .ctrl-btn:not(#drawer-btn),
    #mobile-controls.drawer-open .dpad-label,
    #mobile-controls.drawer-open .gap { visibility: hidden; }

    /* ── Mobile overrides ── */
    @media (max-width: 767px) {
      svg { cursor: default; }

      #sidebar {
        top: auto; bottom: 0;
        left: 0; right: 0;
        width: 100%; height: auto;
        max-height: 70vh;
        border-right: none;
        border-top: 1px solid #1a2a4a;
        border-radius: 14px 14px 0 0;
        transform: translateY(100%);
        transition: transform 0.3s ease;
        font-size: 0.85rem;
      }
      #sidebar.open { transform: translateY(0); }

      #drawer-handle { display: flex; }
      #mobile-controls { display: flex; }
      #name-badge { display: block; }

      #sidebar-controls {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.6rem 1.2rem;
        align-items: center;
      }
      #sidebar-controls input[type="checkbox"] { width: 16px; height: 16px; }
      #trail-length-row { width: 100%; }
      #trail-length { flex: 1; width: auto; }
      #center-btn { width: auto; margin-top: 0; }

      #category-filters { flex-direction: row; flex-wrap: wrap; gap: 0.3rem 0.8rem; }
      .cat-row input { width: 15px; height: 15px; }

      .sat-item { padding: 0.35rem 1rem; }
    }
  </style>
</head>
<body>
  <div id="name-badge"></div>
  <div id="mobile-controls">
    <div id="ctrl-grid">
      <div class="dpad-label" style="grid-column:1/4">rotate</div>
      <div class="dpad-label" style="grid-column:4/7">pan</div>
      <div style="grid-column:7/9"></div>
      <div class="gap"></div>
      <button class="ctrl-btn" id="rot-up">↑</button>
      <div class="gap"></div>
      <div class="gap"></div>
      <button class="ctrl-btn" id="pan-up">⬆</button>
      <div class="gap"></div>
      <button class="ctrl-btn" id="zoom-in-btn">+</button>
      <button class="ctrl-btn" id="center-mobile-btn">⊙</button>
      <button class="ctrl-btn" id="rot-left">←</button>
      <button class="ctrl-btn" id="rot-down">↓</button>
      <button class="ctrl-btn" id="rot-right">→</button>
      <button class="ctrl-btn" id="pan-left">⬅</button>
      <button class="ctrl-btn" id="pan-down">⬇</button>
      <button class="ctrl-btn" id="pan-right">➡</button>
      <button class="ctrl-btn" id="zoom-out-btn">−</button>
      <button class="ctrl-btn" id="drawer-btn">☰</button>
    </div>
  </div>

  <div id="sidebar">
    <div id="drawer-handle"></div>
    <div id="sidebar-controls">
      <label><input type="checkbox" id="trails-toggle" checked> Orbit trails</label>
      <div id="trail-length-row" class="visible">
        <span>Ahead</span>
        <input type="range" id="trail-length" min="1" max="90" value="15">
        <span id="trail-length-value">15 min</span>
      </div>
      <label><input type="checkbox" id="labels-toggle"> Labels</label>
      <label><input type="checkbox" id="time-rotation"> Track time</label>
      <button id="center-btn">Center</button>
    </div>
    <div id="category-filters"></div>
    <div id="sat-list-header">
      <span>Satellites</span>
      <div id="show-selected-row">
        <input type="checkbox" id="show-selected">
        <label for="show-selected">selected</label>
      </div>
    </div>
    <div id="sat-list"></div>
  </div>

  <div id="tooltip"></div>
  <svg id="globe"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@4/dist/satellite.min.js"></script>
  <script src="globe.js"></script>
</body>
</html>
