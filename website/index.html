<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLE Globe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; }
    svg { display: block; cursor: grab; }
    svg:active { cursor: grabbing; }
    .graticule { fill: none; stroke: #1a2a4a; stroke-width: 0.5; }
    .land { fill: #1a3a2a; stroke: #2a5a3a; stroke-width: 0.5; }
    .sphere { fill: #0d1b2a; }
    .border { fill: none; stroke: #0a2a1a; stroke-width: 0.3; }
    .sat { fill: #00ff88; fill-opacity: 0.85; }
    .trail { fill: none; stroke: #00ff88; stroke-width: 0.5; stroke-opacity: 0.25; }
    #controls {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #00ff88;
      font-family: monospace;
      font-size: 0.85rem;
      user-select: none;
    }
    #controls label { cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    #controls input[type="checkbox"] { accent-color: #00ff88; cursor: pointer; }
    #trail-length-row { display: none; margin-top: 0.4rem; align-items: center; gap: 0.4rem; }
    #trail-length-row.visible { display: flex; }
    #trail-length { accent-color: #00ff88; width: 90px; cursor: pointer; }
    #trail-length-value { min-width: 3ch; }
  </style>
</head>
<body>
  <div id="controls">
    <label><input type="checkbox" id="trails-toggle" checked> Orbit trails</label>
    <div id="trail-length-row" class="visible">
      <span>Ahead</span>
      <input type="range" id="trail-length" min="1" max="90" value="5">
      <span id="trail-length-value">5 min</span>
    </div>
  </div>
  <svg id="globe"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@4/dist/satellite.min.js"></script>
<script src="globe.js"></script>
</body>
</html>
