<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLE Globe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; }
    svg { display: block; cursor: grab; }
    svg:active { cursor: grabbing; }
    .graticule { fill: none; stroke: #1a2a4a; stroke-width: 0.5; }
    .land { fill: #1a3a2a; stroke: #2a5a3a; stroke-width: 0.5; }
    .sphere { fill: #0d1b2a; }
    .border { fill: none; stroke: #0a2a1a; stroke-width: 0.3; }
    .sat { fill: #00ff88; fill-opacity: 0.85; }
    .trail { fill: none; stroke: #00ff88; stroke-width: 0.5; stroke-opacity: 0.25; }
    .sat-label { fill: #00ff88; font-family: monospace; font-size: 9px; pointer-events: none; opacity: 0.8; }

    #sidebar {
      position: fixed;
      left: 0; top: 0;
      height: 100vh;
      width: 200px;
      background: rgba(10, 10, 26, 0.88);
      backdrop-filter: blur(4px);
      border-right: 1px solid #1a2a4a;
      display: flex;
      flex-direction: column;
      font-family: monospace;
      font-size: 0.8rem;
      color: #00ff88;
      user-select: none;
      z-index: 10;
    }
    #sidebar-controls {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1a2a4a;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    #sidebar-controls label { cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    #sidebar-controls input[type="checkbox"] { accent-color: #00ff88; cursor: pointer; }
    #trail-length-row { display: none; align-items: center; gap: 0.4rem; }
    #trail-length-row.visible { display: flex; }
    #trail-length { accent-color: #00ff88; width: 80px; cursor: pointer; }
    #trail-length-value { min-width: 4ch; }
    #center-btn {
      background: none;
      border: 1px solid #00ff88;
      color: #00ff88;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.2rem;
    }
    #center-btn:hover { background: rgba(0,255,136,0.1); }

    #sat-list-header {
      padding: 0.4rem 1rem;
      font-size: 0.7rem;
      color: #3a5a4a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #1a2a4a;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #show-selected-row {
      display: none;
      align-items: center;
      gap: 0.3rem;
    }
    #show-selected-row.visible { display: flex; }
    #show-selected-row input { accent-color: #00ff88; cursor: pointer; }
    #show-selected-row label { cursor: pointer; font-size: 0.7rem; }

    #sat-list { overflow-y: auto; flex: 1; }
    .sat-item {
      padding: 0.2rem 1rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sat-item:hover, .sat-item.hovered { background: rgba(0,255,136,0.08); }
    .sat-item.selected { background: rgba(0,255,136,0.15); color: #fff; }

    #tooltip {
      position: fixed;
      background: rgba(10, 10, 26, 0.92);
      color: #00ff88;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border: 1px solid #00ff88;
      pointer-events: none;
      display: none;
      z-index: 20;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-controls">
      <label><input type="checkbox" id="trails-toggle" checked> Orbit trails</label>
      <div id="trail-length-row" class="visible">
        <span>Ahead</span>
        <input type="range" id="trail-length" min="1" max="90" value="5">
        <span id="trail-length-value">5 min</span>
      </div>
      <label><input type="checkbox" id="labels-toggle"> Labels</label>
      <label><input type="checkbox" id="time-rotation"> Track time</label>
      <button id="center-btn">Center</button>
    </div>
    <div id="sat-list-header">
      <span>Satellites</span>
      <div id="show-selected-row">
        <input type="checkbox" id="show-selected">
        <label for="show-selected">selected</label>
      </div>
    </div>
    <div id="sat-list"></div>
  </div>
  <div id="tooltip"></div>
  <svg id="globe"></svg>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@4/dist/satellite.min.js"></script>
  <script src="globe.js"></script>
</body>
</html>
